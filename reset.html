<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Reset Password</title>
    <link rel="stylesheet" href="public/style/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Reset Password</h1>

      <form class="login-form">
        <!-- pass the value of username in input field -->

        <div class="username input-data">
          <label for="username"></label>
          <input
            class="input-field"
            type="text"
            id="username"
            name="username"
            required
            placeholder="Username"
          />
        </div>

        <!-- pass the value of password in input field -->

        <div class="password input-data">
          <label for="reset-password"></label>
          <input
            class="input-field"
            type="password"
            id="reset-password"
            name="reset-password"
            required
            placeholder="Reset Password"
          />
        </div>

        <!-- submit button to login -->

        <div class="submit button">
          <button type="submit">Reset</button>
        </div>
        <p class="comments">
          <a href="#" class="reset_link">Login?</a>or
          <a href="#" class="signup_link">Sign Up</a>
        </p>
      </form>
    </div>
  </body>

  <script src="./scripts/login.js"></script>
</html>

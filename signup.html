<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Sign Up</title>
    <link rel="stylesheet" href="./public/style/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="heading">Sign Up</h1>
      <form class="login-form">
        <!-- pass the value of full name in input field -->

        <div class="username input-data">
          <label for="full-name"></label>
          <input
            class="input-field"
            type="text"
            id="full-name"
            name="full-name"
            required
            placeholder="Full Name"
          />
        </div>

        <!-- pass the value of user name in input field -->

        <div class="username input-data">
          <label for="user-name"></label>
          <input
            class="input-field"
            type="text"
            id="user-name"
            name="user-name"
            required
            placeholder="User Name"
          />
        </div>

        <!-- pass the value of password in input field -->

        <div class="password input-data">
          <label for="set-password"></label>
          <input
            class="input-field"
            type="password"
            id="set-password"
            name="set-password"
            required
            placeholder="Set Password"
          />
        </div>

        <!-- submit button to sign up -->

        <div class="submit button">
          <button type="submit">Sign Up</button>
        </div>
        <p class="comments">
          <a href="#" class="reset_link">Forgot Password?</a> or
          <a href="#" class="signup_link">Sign In</a>
        </p>
      </form>
    </div>
  </body>

  <script src="./scripts/login.js"></script>
</html>
